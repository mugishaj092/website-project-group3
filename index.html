<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <!-- <script src="/src/references.js"></script> -->
</head>


<script>
  const loadComponents = (id, url) => {
    fetch(url)
      .then((response) => response.text())
      .then((html) => {
        document.getElementById(id).innerHTML = html;
      });
  }


  window.onload = () => {
    loadComponents('header', 'sections/header.html');
    loadComponents('hero', 'sections/hero.html');
    loadComponents('contact', 'sections/contact.html');
    loadComponents('footer', 'sections/footer.html');
    loadComponents('references', 'sections/references.html');
  }
</script>

<body>
  <div id="header" class="text-yellow-800"></div>
  <div id="hero"></div>
  <div id="contact"></div>
  <div id="footer"></div>
  <div id="references" ></div>
  
</body>
</html>
