<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
<script>
  const loadComponents = (id, url) => {
    fetch(url)
      .then((response) => response.text())
      .then((html) => {
        document.getElementById(id).innerHTML = html;
        if(id === "header"){
            menuBar();
          }
        if(id === 'hero'){
            moveShape();
        }  
      });
  }


  window.onload = () => {
    loadComponents('header', 'sections/header.html');
    loadComponents('hero', 'sections/hero.html');
    loadComponents('contact', 'sections/contact.html');
    loadComponents('footer', 'sections/footer.html');
    loadComponents('yellowsec', 'sections/yellowsec.html');
  }

  const menuBar = () => {
  const menuToggle = document.getElementById("menuToggle");
  const menu = document.getElementById("menu");
  const hamburger = document.getElementById("hamburger");
  const closeIcon = document.getElementById("closeIcon");

  menuToggle.addEventListener("click", () => {
    menu.classList.toggle("hidden");
    hamburger.classList.toggle("hidden");
    closeIcon.classList.toggle("hidden");
  });
  };

  const moveShape = () => {
    const shapes = document.getElementById("shapes")
    const menuToggle2 = document.getElementById("menuToggle");
    menuToggle2.addEventListener('click', () => {
      shapes.classList.toggle("mt-[250px]");
    })
  }
</script>

<body>
  <div id="header"></div>
  <div id="hero"></div>
  <div id="yellowsec"></div>
  <div id="footer"></div>
</body>
</html>
