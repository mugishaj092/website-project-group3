<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="./src/style.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="header"></div>
  <div id="hero"></div>
  <div id="about"></div>
  <!-- <div id="references"></div> -->
  <div id="yellowsec1"  class="hidden md:block xl:hidden"></div>
  <div id="contact"></div>
  <div id="footer" class="hidden md:block xl:hidden"></div>

  <script>
    const loadComponents = (id, url) => {
      fetch(url)
        .then((response) => response.text())
        .then((html) => {
          document.getElementById(id).innerHTML = html;
          if (id === "header") menuBar();
          if (id === "hero") moveShape();
        })
        .catch(err => console.error(`Error loading ${url}:`, err));
    };

    window.onload = () => {
      loadComponents('header', 'sections/header.html');
      loadComponents('hero', 'sections/hero.html');
      loadComponents('about', 'sections/about.html');
      loadComponents('yellowsec', 'sections/yellowsec.html');
      loadComponents('yellowsec1', 'sections/yellowsec.html');
      loadComponents('references', 'sections/references.html');
      loadComponents('references3', 'sections/references.html');
      loadComponents('contact', 'sections/contact.html');
      loadComponents('footer', 'sections/footer.html');
      loadComponents('footer-index', 'sections/footer.html');
    };

    const menuBar = () => {
      const menuToggle = document.getElementById("menuToggle");
      const menu = document.getElementById("menu");
      const hamburger = document.getElementById("hamburger");
      const closeIcon = document.getElementById("closeIcon");

      if (menuToggle) {
        menuToggle.addEventListener("click", () => {
          menu.classList.toggle("hidden");
          hamburger.classList.toggle("hidden");
          closeIcon.classList.toggle("hidden");
        });
      }
    };

    const moveShape = () => {
      const shapes = document.getElementById("shapes");
      const menuToggle2 = document.getElementById("menuToggle");
      if (menuToggle2 && shapes) {
        menuToggle2.addEventListener('click', () => {
          shapes.classList.toggle("mt-[250px]");
        });
      }
    };
  </script>
  <script src="/public/js/references.js"></script>
  <script src="/public/js/contact.js"></script>
  
</body>
</html>
